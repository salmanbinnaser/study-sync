<!DOCTYPE html>
<html>

<head>

    <title>StudySync</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e6e6e6;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: blue;
            text-align: center;
            font-size: 45px;
        }

        h2 {
            margin-top: 30px;
        }

        input,
        textarea {
            width: 300px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            background-color: blue;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: darkblue;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: white;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            width: 500px;
        }

        span {
            margin-left: 10px;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        #dateTime {
            width: 320px;
            margin: auto;
            margin-bottom: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: blue;
            box-shadow: 0px 2px 8px gray;
        }

        #taskCount {
            font-weight: bold;
            color: darkgreen;
        }

        /* DARK MODE */

        .dark {
            background-color: #222;
            color: white;
        }

        .dark li {
            background-color: #333;
        }

        .dark h2,
        .dark p,
        .dark span {
            color: white;
        }

        .dark button {
            background-color: #555;
            color: white;
        }

        .dark input,
        .dark textarea {
            background-color: #444;
            color: white;
            border: 1px solid gray;
        }

        .dark input::placeholder,
        .dark textarea::placeholder {
            color: lightgray;
        }

        .dark a {
            color: lightblue;
        }

        .dark #dateTime {
            background-color: #333;
            color: lightblue;
        }

        .dark #taskCount {
            color: lightgreen;
        }
        
        /* StudySync color in Dark Mode */
        .dark h1 {
        color: #00ffff;
        }

    </style>

</head>

<body>

    <button onclick="darkMode()">Dark Mode</button>

    <h1>StudySync</h1>

    <p id="dateTime"></p>

    <!-- TASK MANAGER -->

    <h2>Task Manager</h2>

    <p id="taskCount">Total Tasks: 0</p>

    <input type="text" id="taskInput" placeholder="Enter Task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>


    <!-- RESOURCE LINKS -->

    <h2>Resource Links</h2>

    <input type="text" id="linkInput" placeholder="Enter link">

    <button onclick="addLink()">Add Link</button>

    <ul id="linkList"></ul>


    <!-- DEADLINES -->

    <h2>Deadline Reminder</h2>

    <input type="text" id="deadlineInput" placeholder="Enter deadline">

    <button onclick="addDeadline()">Add Deadline</button>

    <ul id="deadlineList"></ul>


    <!-- NOTES -->

    <h2>Notes</h2>

    <textarea id="noteInput" rows="5" cols="40"></textarea>

    <br><br>

    <button onclick="saveNote()">Save Note</button>

    <p id="savedNote"></p>


    <script>

        // PAGE LOAD

        window.onload = function () {

            showDateTime();

            loadTasks();

            loadLinks();

            loadDeadlines();

            loadNote();

            updateTaskCount();
        };


        // TASKS

        function addTask() {

            var task = document.getElementById("taskInput").value;

            if (task == "") {
                alert("Enter a task");
                return;
            }

            var li = document.createElement("li");

            var checkbox = document.createElement("input");

            checkbox.type = "checkbox";

            var text = document.createElement("span");

            text.innerHTML = task;

            checkbox.onclick = function () {

                if (checkbox.checked) {
                    text.style.textDecoration = "line-through";
                }
                else {
                    text.style.textDecoration = "none";
                }

                saveTasks();
            };

            var deleteButton = document.createElement("button");

            deleteButton.innerHTML = "Delete";

            deleteButton.onclick = function () {

                li.remove();

                saveTasks();

                updateTaskCount();
            };

            li.appendChild(checkbox);

            li.appendChild(text);

            li.appendChild(deleteButton);

            document.getElementById("taskList").appendChild(li);

            saveTasks();

            updateTaskCount();

            document.getElementById("taskInput").value = "";
        }


        function saveTasks() {

            localStorage.setItem(
                "tasks",
                document.getElementById("taskList").innerHTML
            );
        }


        function loadTasks() {

            var savedTasks = localStorage.getItem("tasks");

            if (savedTasks != null) {

                document.getElementById("taskList").innerHTML = savedTasks;

                reconnectTaskButtons();
            }
        }


        function reconnectTaskButtons() {

            var buttons = document.querySelectorAll("#taskList button");

            buttons.forEach(function (button) {

                button.onclick = function () {

                    button.parentElement.remove();

                    saveTasks();

                    updateTaskCount();
                };
            });

            var checkboxes =
                document.querySelectorAll("#taskList input[type='checkbox']");

            checkboxes.forEach(function (checkbox) {

                checkbox.onclick = function () {

                    var text = checkbox.nextElementSibling;

                    if (checkbox.checked) {
                        text.style.textDecoration = "line-through";
                    }
                    else {
                        text.style.textDecoration = "none";
                    }

                    saveTasks();
                };
            });
        }


        // LINKS

        function addLink() {

            var link = document.getElementById("linkInput").value;

            if (link == "") {
                alert("Enter a link");
                return;
            }

            var li = document.createElement("li");

            var a = document.createElement("a");

            a.href = link;

            a.target = "_blank";

            a.innerHTML = link;

            var deleteButton = document.createElement("button");

            deleteButton.innerHTML = "Delete";

            deleteButton.onclick = function () {

                li.remove();

                saveLinks();
            };

            li.appendChild(a);

            li.appendChild(deleteButton);

            document.getElementById("linkList").appendChild(li);

            saveLinks();

            document.getElementById("linkInput").value = "";
        }


        function saveLinks() {

            localStorage.setItem(
                "links",
                document.getElementById("linkList").innerHTML
            );
        }


        function loadLinks() {

            var savedLinks = localStorage.getItem("links");

            if (savedLinks != null) {

                document.getElementById("linkList").innerHTML = savedLinks;

                reconnectLinkButtons();
            }
        }


        function reconnectLinkButtons() {

            var buttons = document.querySelectorAll("#linkList button");

            buttons.forEach(function (button) {

                button.onclick = function () {

                    button.parentElement.remove();

                    saveLinks();
                };
            });
        }


        // DEADLINES

        function addDeadline() {

            var deadline =
                document.getElementById("deadlineInput").value;

            if (deadline == "") {
                alert("Enter deadline");
                return;
            }

            var li = document.createElement("li");

            li.innerHTML = deadline;

            var deleteButton = document.createElement("button");

            deleteButton.innerHTML = "Delete";

            deleteButton.onclick = function () {

                li.remove();

                saveDeadlines();
            };

            li.appendChild(deleteButton);

            document.getElementById("deadlineList").appendChild(li);

            saveDeadlines();

            document.getElementById("deadlineInput").value = "";
        }


        function saveDeadlines() {

            localStorage.setItem(
                "deadlines",
                document.getElementById("deadlineList").innerHTML
            );
        }


        function loadDeadlines() {

            var savedDeadlines =
                localStorage.getItem("deadlines");

            if (savedDeadlines != null) {

                document.getElementById("deadlineList").innerHTML =
                    savedDeadlines;

                reconnectDeadlineButtons();
            }
        }


        function reconnectDeadlineButtons() {

            var buttons =
                document.querySelectorAll("#deadlineList button");

            buttons.forEach(function (button) {

                button.onclick = function () {

                    button.parentElement.remove();

                    saveDeadlines();
                };
            });
        }


        // NOTES

        function saveNote() {

            var note =
                document.getElementById("noteInput").value;

            document.getElementById("savedNote").innerHTML = note;

            localStorage.setItem("note", note);
        }


        function loadNote() {

            var savedNote = localStorage.getItem("note");

            if (savedNote != null) {

                document.getElementById("savedNote").innerHTML =
                    savedNote;

                document.getElementById("noteInput").value =
                    savedNote;
            }
        }


        // DARK MODE

        function darkMode() {

            document.body.classList.toggle("dark");
        }


        // DATE AND TIME

        function showDateTime() {

            var now = new Date();

            document.getElementById("dateTime").innerHTML =
                now.toLocaleString();
        }

        setInterval(showDateTime, 1000);


        // TASK COUNTER

        function updateTaskCount() {

            var total =
                document.querySelectorAll("#taskList li").length;

            document.getElementById("taskCount").innerHTML =
                "Total Tasks: " + total;
        }

    </script>

</body>

</html>
